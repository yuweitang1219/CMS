<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人智能生活儀表板 - 平板模式</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css?v=30.0">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
        }
        .tablet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 90px);
            padding: 0 20px 20px 20px;
        }
    </style>
</head>
<body data-theme="dark">
    
    <!-- Background Orbs -->
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="dashboard-header" style="margin-bottom: 15px;">
        <div class="header-left">
            <div class="clock-display">
                <span id="clock-time">00:00:00</span>
                <span id="clock-date">2026年08月14日 星期五</span>
            </div>
        </div>
        
        <div class="header-center">
            <div class="weather-display" id="weather-widget">
                <div class="weather-info">
                    <span class="weather-location"><i class="fa-solid fa-location-dot"></i> 桃園</span>
                    <span id="weather-temp">--°C</span>
                    <span id="weather-cond"><i class="fa-solid fa-spinner fa-spin"></i> 載入中</span>
                </div>
            </div>
        </div>
        
        <div class="header-right">
            <button class="btn btn-secondary btn-icon-only" onclick="toggleTheme()" title="切換主題">
                <i class="fa-solid fa-sun" id="theme-icon"></i>
            </button>
            <button class="btn btn-secondary btn-icon-only" id="fullscreen-btn" onclick="toggleFullscreen()" title="切換全螢幕">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- Tablet Grid: Left Calendar, Right Tasks -->
    <main class="tablet-grid">
        
        <!-- Left: Google Calendar -->
        <section class="grid-card calendar-card" style="height: 100%; overflow-y: auto;">
            <div class="card-header">
                <div class="header-title">
                    <i class="fa-solid fa-calendar-days icon-accent-calendar"></i>
                    <h2>我的日程表</h2>
                </div>
                <div class="card-actions">
                    <button class="btn btn-secondary btn-icon-only" onclick="fetchEvents()" title="重新整理">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button class="btn btn-primary" onclick="openAddEventModal()">
                        <i class="fa-solid fa-plus"></i> <span>安排行程</span>
                    </button>
                </div>
            </div>

            <div id="calendar-disconnected-state" class="calendar-disconnected-overlay hidden">
                <div class="disconnected-content">
                    <div class="icon-glow">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <h3>串接 Google 日曆</h3>
                    <p>連線您的 Google 帳戶同步管理行程。</p>
                </div>
            </div>

            <div id="calendar-connected-state" class="calendar-inner-grid">
                <div class="mini-calendar-container">
                    <div class="mini-calendar-header">
                        <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <div class="calendar-title-group">
                            <h3 id="mini-calendar-month-year">2026年8月</h3>
                            <span id="mini-calendar-clock" class="mini-calendar-clock hidden">00:00:00</span>
                        </div>
                        <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <div class="mini-calendar-weekdays">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div id="mini-calendar-days" class="mini-calendar-days">
                        <!-- Dynamic days -->
                    </div>
                </div>
            </div>
            
            <div class="events-timeline" style="margin-top: 15px;">
                <div class="events-timeline-header">
                    <h3><i class="fa-solid fa-clock-rotate-left icon-accent-calendar"></i> 當日行程明細</h3>
                </div>
                <div id="events-list-empty" class="empty-state hidden">
                    <i class="fa-solid fa-calendar-minus empty-icon"></i>
                    <p>此日期沒有安排任何行程</p>
                </div>
                <div id="events-list" class="events-list">
                    <!-- Dynamic events -->
                </div>
            </div>
        </section>

        <!-- Right: To-Do List -->
        <section class="grid-card todo-card" style="height: 100%; display: flex; flex-direction: column;">
            <div class="card-header">
                <div class="header-title">
                    <i class="fa-solid fa-list-check icon-accent-todo"></i>
                    <h2>待辦事項</h2>
                </div>
                <div class="todo-progress-container">
                    <div class="progress-ring-box">
                        <svg class="progress-ring" width="46" height="46">
                            <circle class="progress-ring-bg" stroke="rgba(255,255,255,0.05)" stroke-width="4" fill="transparent" r="18" cx="23" cy="23"/>
                            <circle id="todo-progress-circle" class="progress-ring-bar" stroke="url(#todo-gradient)" stroke-width="4" stroke-dasharray="113" stroke-dashoffset="113" stroke-linecap="round" fill="transparent" r="18" cx="23" cy="23"/>
                        </svg>
                        <span id="todo-progress-percentage" class="progress-text">0%</span>
                    </div>
                    <span id="todo-progress-count" class="todo-progress-label">0 / 0 完成</span>
                </div>
            </div>

            <form id="todo-form" onsubmit="handleAddTodo(event)" class="todo-input-form">
                <div class="todo-input-row">
                    <input type="text" id="todo-input-title" placeholder="新增待辦事項..." required autocomplete="off">
                    <div class="todo-input-meta">
                        <select id="todo-input-priority" class="priority-select">
                            <option value="low">低優先權</option>
                            <option value="medium" selected>中優先權</option>
                            <option value="high">高優先權</option>
                        </select>
                        <input type="date" id="todo-input-date" class="date-select">
                    </div>
                </div>
                <button type="submit" class="btn btn-todo-add">
                    <i class="fa-solid fa-plus"></i> 新增任務
                </button>
            </form>

            <div class="todo-list-container" style="flex: 1; overflow-y: auto;">
                <div id="todo-list-empty" class="empty-state hidden">
                    <i class="fa-solid fa-clipboard-check empty-icon"></i>
                    <p>目前沒有待辦事項</p>
                </div>
                <ul id="todo-list" class="todo-list">
                    <!-- Dynamic items -->
                </ul>
            </div>
        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast-container hidden">
        <span id="toast-message">提示訊息</span>
    </div>

    <script src="/app.js?v=30.0"></script>
</body>
</html>
